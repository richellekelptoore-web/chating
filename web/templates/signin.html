<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChatGlyo Browser</title>
  <style>
    body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f3f8f4;color:#1f3d2d}
    .wave{height:130px;background:linear-gradient(180deg,#34cc74,#129a4d);animation:wave 3s ease-in-out infinite}
    @keyframes wave{0%{clip-path:polygon(0 43%,15% 50%,30% 41%,46% 54%,62% 40%,79% 53%,100% 44%,100% 100%,0 100%)}50%{clip-path:polygon(0 54%,15% 41%,30% 55%,46% 40%,62% 56%,79% 42%,100% 54%,100% 100%,0 100%)}100%{clip-path:polygon(0 43%,15% 50%,30% 41%,46% 54%,62% 40%,79% 53%,100% 44%,100% 100%,0 100%)}}
    .card{background:#fff;border:1px solid #d7e4db;border-radius:12px;padding:18px;max-width:760px;margin:16px auto}
    .row{display:flex;gap:8px;align-items:center}.grow{flex:1}
    input,button{font-size:15px;padding:10px;border-radius:8px;border:1px solid #cfe0d3}
    button{background:#149b50;color:#fff;border:none}button[disabled]{background:#a4cfb2}
  </style>
</head>
<body>
<div class="wave"></div>
<div class="card">
  <h2>ChatGlyo [BROWSER]</h2>
  <form method="post" action="/signin">
    <p>Enter your Username</p>
    <div class="row"><input class="grow" name="username" value="{{username}}"/><span>{{u_dot}}</span></div>
    <p>Enter your Email</p>
    <div class="row"><input class="grow" name="email" value="{{email}}"/><span>{{e_dot}}</span></div>
    <p>Enter your Password</p>
    <div class="row"><input class="grow" type="password" name="password" value="{{password}}"/><span>{{p_dot}}</span></div>
    <p>Done {{done}}/3 ({{done_state}})</p>
    <button {{done_disabled}}>0&lt;-- Done --&gt;0</button>
  </form>
</div>
</body>
</html>
